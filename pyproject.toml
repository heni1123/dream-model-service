[project]
name = "dream-model-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "openai>=1.40",        # SDK unifié
  "jsonschema>=4.23",
  "httpx>=0.27",
  "faiss-cpu>=1.7.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
